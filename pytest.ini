[pytest]
# 测试目录与默认参数
testpaths = tests
addopts = -q -p no:tmpdir -p no:cacheprovider --strict-markers
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# 为什么禁用 tmpdir / cacheprovider：
#   1) 沙箱对「删除」是累积计数拦截的，pytest 启动时会 rmtree basetemp、收尾会清理
#      numbered dirs，触发 SAFE_DELETE_BULK_REJECTED，整条命令被拒；
#   2) 因此本项目不用 tmp_path/tmpdir，改用 tests/conftest.py 的 `sandbox` fixture，
#      在项目内 tmp_pytest/ 下建目录且从不删除（该目录已 gitignore）。
#   cacheprovider 会写 .pytest_cache 并在多次运行间复用，同样会碰删除逻辑。

markers =
    unit: 单元测试（纯函数与单模块，不联网、不起服务）
    integration: 集成测试（多模块协作，可能起本地 HTTP 服务）
    e2e: 端到端测试（从数据到页面到用户操作走完整链路）
    ui: 需要真实浏览器（Edge + CDP），默认跳过，设 RUN_UI_E2E=1 才执行
    slow: 较慢（>2s）的用例

filterwarnings =
    ignore::DeprecationWarning
